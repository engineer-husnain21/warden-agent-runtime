[project]
name = "warden-agent-runtime"
version = "0.1.0"
description = "Governed runtime for AI agents that take real actions: MCP tools, human approval, audit log and CI-gated evals."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Code samples in docs (e.g. CLAUDE.md) are reference text, not project code.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "T20",      # no print() (CLAUDE.md section 8)
    "RUF",      # ruff-specific
]

[tool.mypy]
# Single source of truth for type-checked folders: green check, pre-commit and CI run bare `mypy`.
files = ["app", "tests"]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
