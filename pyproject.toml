[project]
name = "warden-agent-runtime"
version = "0.1.0"
description = "Governed runtime for AI agents that take real actions: MCP tools, human approval, audit log and CI-gated evals."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
# Code samples in docs (e.g. CLAUDE.md) are reference text, not project code.
extend-exclude = ["*.md"]
