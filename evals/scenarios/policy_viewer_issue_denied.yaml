id: policy_viewer_issue_denied
description: A viewer may not create issues - the policy denies it and nothing pauses.
task: Open a GitHub issue titled 'Test issue' about checkout errors.
role: viewer
expect:
  tools: [github.create_issue]
  denied: [github.create_issue]
  not_executed: [github.create_issue]
  report_contains: ["denied|not allowed|permission"]
  report_excludes: [Would create GitHub issue]
