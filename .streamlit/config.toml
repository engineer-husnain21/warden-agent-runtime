# Warden console theme: dark, quiet surfaces, one indigo accent (Linear/Vercel style).
# Streamlit reads this file from the folder `streamlit run` is started in (the project root).

[theme]
base = "dark"
primaryColor = "#6E7BF2"
backgroundColor = "#0B0C0F"
secondaryBackgroundColor = "#15171C"
textColor = "#E6E8EE"
linkColor = "#8B95F7"
borderColor = "#262A33"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
